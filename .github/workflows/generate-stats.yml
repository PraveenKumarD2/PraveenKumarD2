name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate GitHub stats SVG
        uses: cicirello/user-statistician@v1
        with:
          colors: dark
          include-title: true
          show-border: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
